services:
  awg2:
    build: .
    image: proxy-awg2-awg2:awg2-v2-pinned
    pull_policy: never
    container_name: awg2
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./awg-config:/config:ro
    ports:
      - "192.168.0.8:38109:38108"
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -x amneziawg-go >/dev/null && ip link show awg0 >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  proxy-awg2:
    image: ghcr.io/senseunit/dumbproxy:latest
    container_name: proxy-awg2
    network_mode: "service:awg2"
    entrypoint: ["/dumbproxy"]
    command:
      - "-bind-address"
      - ":38108"
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
    depends_on:
      awg2:
        condition: service_healthy
        restart: true
    restart: unless-stopped
