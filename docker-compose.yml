services:
  awg2:
    build: .
    image: proxy-awg2-awg31-watchdog:3.1.20260830-fixed2
    pull_policy: never
    container_name: awg2
    privileged: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      AWG_WATCHDOG_ENABLED: "true"
      AWG_WATCHDOG_INTERVAL: "15"
      AWG_HANDSHAKE_MAX_AGE: "180"
      AWG_WATCHDOG_FAILURES: "3"
      AWG_RECOVERY_COOLDOWN: "300"
      AWG_STARTUP_GRACE: "120"
      AWG_PROXY_PROBE_TIMEOUT: "8"
      AWG_PROXY_CANARY_URL: "http://1.1.1.1/"
      AWG_MAX_RECOVERIES: "3"
      AWG_RECOVERY_WINDOW: "3600"
    volumes:
      - ${AWG_CONFIG_DIR:-/root/awg-client}:/config:ro
    ports:
      - "${PROXY_BIND_IP:-192.168.0.8}:${PROXY_PORT:-38109}:38108"
    healthcheck:
      test:
        - CMD-SHELL
        - pgrep -x amneziawg-go >/dev/null && ip link show awg0 >/dev/null 2>&1 && awg show awg0 >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  proxy-awg2:
    image: ghcr.io/senseunit/dumbproxy@sha256:d395e5741f292d0aac9488319e90333e94a4db2fd5a1faad5f1606cc9a143610
    container_name: proxy-awg2
    network_mode: "service:awg2"
    entrypoint: ["/dumbproxy"]
    command:
      - "-bind-address"
      - ":38108"
    volumes:
      - ./resolv.conf:/etc/resolv.conf:ro
    depends_on:
      awg2:
        condition: service_healthy
        restart: true
    restart: unless-stopped
